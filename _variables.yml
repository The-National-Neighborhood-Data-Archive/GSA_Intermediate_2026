# Single source of truth for anything that appears in BOTH slides.qmd and
# notebook.qmd. Reference in prose as {{< var session.date >}} etc.
# If you find yourself typing a dataset name or DOI twice, put it here instead.

session:
  title: "Linking NaNDA With Your Data"
  track: "Breakout 2 — Intermediate"
  date: "October 10, 2026"
  length: "45 minutes"
  platform: "Zoom"
  facilitator: "Will Clary"
  presenter: "Robert Melendez"
  discussant: "Grace Noppert"
  start_time: "per the GSA program"   # not rendered anywhere; GSA never confirmed a clock time

# Timings live here and nowhere else. The section headers in notebook.qmd read from
# these, so a schedule change happens in one place. Section 3 is the payoff and is
# never cut; sections 1, 2, and 4 are sized to leave real slack.
timing:
  open: 2            # framing
  sec1: 8            # identifiers
  sec2: 12           # ZIP to ZCTA
  sec3: 15           # vintage + diagnostics — do not cut this one
  sec4: 4            # analysis + implications
  close: 1           # URL, thanks
  slack: 3
  total: 45

site:
  url: "https://the-national-neighborhood-data-archive.github.io/GSA_Intermediate_2026/"
  short_url: "https://the-national-neighborhood-data-archive.github.io/GSA_Intermediate_2026/"   # no go.umich.edu link minted; same as url, not rendered anywhere
  repo: "https://github.com/The-National-Neighborhood-Data-Archive/GSA_Intermediate_2026"
  zip: "https://the-national-neighborhood-data-archive.github.io/GSA_Intermediate_2026/workshop-materials.zip"
  doi: "DOI assigned at the v1.0.0 release (Zenodo); until then, cite the repository URL"   # replace with the DOI once Zenodo mints it, then re-render

nanda:
  social_services_name: "NaNDA: Social Services"
  social_services_doi: "https://doi.org/10.3886/ICPSR208207.V5"
  social_services_years: "1990–2022"
  parks_name: "NaNDA: Parks"
  parks_doi: "https://doi.org/10.3886/ICPSR38586"
  parks_years: "2018, 2022"
  geography: "ZCTA (every NaNDA dataset released to date also ships a ZCTA version)"

crosswalk:
  primary_name: "UDS Mapper ZIP Code to ZCTA Crosswalk"
  primary_url: "https://web.archive.org/web/20220402144231/https://udsmapper.org/wp-content/uploads/2021/12/ZIPCodetoZCTACrosswalk2019.xlsx"
  primary_year: "2019"
  primary_zcta_vintage: "2010"    # matches data/zip_to_zcta_2019.xlsx, which Robert's code reads
  merge_code_name: "Chenoweth & Khan, code for merging NaNDA ZCTA-level datasets with the UDS Mapper crosswalk"
  merge_code_doi: "https://doi.org/10.3886/E124461V4"
  merge_code_year: "2024"

