# Single source of truth for names, dates, DOIs, URLs, and timings used in
# index.qmd and notebook.qmd. Reference in prose as {{< var session.date >}} etc.
# If you find yourself typing a dataset name or DOI twice, put it here instead.

session:
  title: "Linking NaNDA With Your Data"
  track: "Breakout 2 — Intermediate"
  date: "October 7, 2026"
  length: "45 minutes"
  platform: "Zoom"
  facilitator: "Will Clary"
  facilitator_url: "https://github.com/w-clary"
  presenter: "Robert Melendez"
  discussant: "Grace Noppert"
  start_time: "per the GSA program"   # not rendered anywhere; GSA never confirmed a clock time

# Timings live here and nowhere else. The section headers in notebook.qmd read from
# these, so a schedule change happens in one place. The join section is the payoff
# and is never cut; the others are sized to leave real slack.
timing:
  open: 2            # framing
  identifiers: 6     # section 1
  geocoding: 4       # section 2, Robert's explanation; no live code
  crosswalk: 10      # section 3, ZIP to ZCTA
  join: 15           # section 4, boundaries + diagnostics — do not cut this one
  analysis: 4        # section 5, Grace
  close: 1           # URL, thanks
  slack: 3
  total: 45

site:
  url: "https://the-national-neighborhood-data-archive.github.io/GSA_Intermediate_2026/"
  short_url: "https://the-national-neighborhood-data-archive.github.io/GSA_Intermediate_2026/"   # no go.umich.edu link minted; same as url, not rendered anywhere
  repo: "https://github.com/The-National-Neighborhood-Data-Archive/GSA_Intermediate_2026"
  zip: "https://the-national-neighborhood-data-archive.github.io/GSA_Intermediate_2026/workshop-materials.zip"
  doi: "10.5281/zenodo.23071407"          # concept DOI (Zenodo); always resolves to the latest version
  doi_url: "https://doi.org/10.5281/zenodo.23071407"
  doi_v1: "10.5281/zenodo.23071408"       # version DOI for v1.0.0

